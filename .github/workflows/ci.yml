name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync and test
        run: |
          uv sync --extra dev
          uv run ruff check src tests
          uv run ruff format src tests --check
          uv run pyright src
          uv run pytest tests -q

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install and gate webapp
        run: |
          npm ci
          npm run biome:ci
          npm run check
          npm run build

  e2e:
    runs-on: windows-latest
    needs: [test, web]
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps and browsers
        run: |
          uv sync --extra dev
          npm ci
          npm run e2e:install
      - name: Playwright smoke (dashboard + proxy + nav walk)
        run: npm run e2e
        env:
          CI: "true"
