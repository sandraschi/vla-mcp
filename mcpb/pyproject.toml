[project]
name = "vla-mcp"
version = "0.3.1b1"
description = "FastMCP 3.2 bridge for Vision-Language-Action: Wall-OSS-0.5, WALL-WM, DMuon co-training, and fleet simulation loops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schipal", email = "sandra@sandraschi.dev" }]
keywords = [
    "mcp",
    "vla",
    "robotics",
    "world-model",
    "wall-oss",
    "wall-wm",
    "fastmcp",
    "spatial-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=3.4.2,<4",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "huggingface-hub>=0.29.0",
    "numpy>=1.26.0",
    "prefab-ui>=0.18.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[project.scripts]
vla-mcp = "vla_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/vla_mcp/engine/dmuon_runner.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
